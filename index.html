<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Tasks – MDF</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eef7f9; --card:#fff; --ink:#123038; --muted:#5d7a82; --line:#d6e8ec;
  --brand:#00838f; --brand2:#0097a7; --brand-soft:#e0f4f6;
  --done:#1e8e3e; --done-bg:#e6f4ea; --delay:#b26a00; --delay-bg:#fff4e0;
  --pend:#c62828; --pend-bg:#fdecea; --other:#5f6368; --other-bg:#f1f3f4;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;font-size:14px}
button,input,select{font:inherit}
.hidden{display:none!important}

/* Login */
#login{min-height:100vh;display:grid;place-items:center;padding:16px;
  background:linear-gradient(135deg,#00838f 0%,#4dd0e1 100%)}
.login-card{background:#fff;width:100%;max-width:360px;border-radius:16px;padding:28px 24px;box-shadow:0 12px 40px rgba(0,0,0,.18)}
.login-card h1{font-size:22px;margin-bottom:4px}
.login-card p{color:var(--muted);margin-bottom:20px}
.login-card label{display:block;font-weight:600;font-size:13px;margin:12px 0 6px}
.login-card input{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;outline:none}
.login-card input:focus{border-color:var(--brand)}
.btn{background:var(--brand);color:#fff;border:0;border-radius:10px;padding:12px 16px;font-weight:600;cursor:pointer}
.btn:disabled{opacity:.6}
.login-card .btn{width:100%;margin-top:20px}
.err{color:var(--pend);font-size:13px;margin-top:10px;min-height:18px}

/* App */
header{height:64px;background:var(--brand);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:5}
header h2{font-size:17px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header small{opacity:.85;font-weight:400}
.avatar{width:40px;height:40px;border-radius:50%;flex:none;border:2px solid rgba(255,255,255,.8);background:#fff center/cover no-repeat;
  display:grid;place-items:center;color:var(--brand);font-weight:700;font-size:16px;cursor:pointer;position:relative;padding:0}
.avatar .cam{position:absolute;right:-3px;bottom:-3px;width:18px;height:18px;border-radius:50%;background:#fff;color:var(--brand);
  font-size:11px;display:grid;place-items:center;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.avatar.busy{opacity:.5}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#123038;color:#fff;padding:10px 16px;border-radius:10px;
  font-size:13px;z-index:20;max-width:calc(100% - 32px)}
.ghost{background:rgba(255,255,255,.15);color:#fff;border:0;border-radius:8px;padding:8px 12px;cursor:pointer;font-weight:500}
main{max-width:1100px;margin:0 auto;padding:16px}

/* Sidebar */
#app{min-height:100vh}
.layout{display:flex;min-height:calc(100vh - 64px)}
.content{flex:1;min-width:0}
aside#side{width:270px;flex:none;background:#0f2a30;color:#e6f3f5;position:sticky;top:64px;height:calc(100vh - 64px);
  overflow-y:auto;transition:margin-left .25s ease;padding:16px 12px 24px}
#app.side-closed aside#side{margin-left:-270px}
.menu-btn{width:40px;height:40px;flex:none;border-radius:10px;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.1);
  color:#fff;font-size:20px;line-height:1;cursor:pointer;display:grid;place-items:center}
.profile{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:8px 6px 18px;margin-bottom:6px;border-bottom:1px solid rgba(255,255,255,.1)}
.profile .pic{width:140px;height:140px;border-radius:50%;flex:none;background:#4dd0e1 center/cover no-repeat;display:grid;place-items:center;
  font-size:56px;font-weight:700;color:#0f2a30;cursor:pointer;position:relative;border:4px solid rgba(77,208,225,.55);box-shadow:0 6px 18px rgba(0,0,0,.35)}
.profile .pic .cam{position:absolute;right:8px;bottom:8px;width:30px;height:30px;border-radius:50%;background:#fff;font-size:15px;
  display:grid;place-items:center;box-shadow:0 1px 4px rgba(0,0,0,.35)}
.profile .dg{font-size:15px;color:#4dd0e1;font-weight:700}
.profile .dp{font-size:12.5px;color:#9cc7cd;margin-top:2px}
.side-sec{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#7fb3bb;font-weight:700;margin:18px 6px 8px}
.side-sec:first-child{margin-top:0}
.side-range{font-size:12px;color:#9cc7cd;margin:0 6px 10px}
.s-item{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;color:inherit;text-align:left;
  padding:10px 10px;border-radius:10px;cursor:pointer;font-size:14px}
.s-item:hover{background:rgba(255,255,255,.06)}
.s-item.on{background:rgba(77,208,225,.16);color:#fff}
.s-item .dot{width:10px;height:10px;border-radius:50%;flex:none}
.s-item .lbl2{flex:1}
.s-item b{font-variant-numeric:tabular-nums;font-size:15px}
.s-day{display:block;width:100%;background:none;border:0;color:inherit;text-align:left;padding:8px 10px;border-radius:10px;cursor:pointer}
.s-day:hover{background:rgba(255,255,255,.06)}
.s-day .top{display:flex;justify-content:space-between;font-size:13px;font-weight:600}
.s-day .top span{color:#9cc7cd;font-weight:500}
.s-day .bar{display:flex;height:6px;border-radius:3px;overflow:hidden;background:rgba(255,255,255,.1);margin:6px 0 4px}
.s-day .bar i{display:block;height:100%}
.s-day .mini{font-size:11px;color:#9cc7cd;display:flex;gap:10px}
.c-done{background:#34a853}.c-delay{background:#f9a825}.c-pend{background:#ef5350}.c-other{background:#90a4ae}.c-all{background:#4dd0e1}
.side-empty{color:#7fb3bb;font-size:13px;padding:6px 10px}
.backdrop{display:none}
@media (max-width:900px){
  aside#side{position:fixed;left:0;top:64px;z-index:15;box-shadow:4px 0 20px rgba(0,0,0,.3)}
  #app:not(.side-closed) .backdrop{display:block;position:fixed;inset:64px 0 0 0;background:rgba(0,0,0,.35);z-index:14}
}

.controls{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:12px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.row label{font-size:12px;color:var(--muted);font-weight:600}
.field{display:flex;flex-direction:column;gap:4px}
.field input,.field select{padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;min-width:140px}
.quick button{background:var(--brand-soft);color:var(--brand);border:0;border-radius:20px;padding:7px 12px;font-weight:600;cursor:pointer;font-size:13px}
.quick button.on{background:var(--brand);color:#fff}
#search{flex:1;min-width:180px;padding:9px 12px;border:1px solid var(--line);border-radius:8px}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:14px 0}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;transition:.15s;border-left:4px solid var(--brand)}
.kpi.on{box-shadow:0 0 0 2px var(--brand)}
.kpi b{display:block;font-size:24px}
.kpi span{font-size:12px;color:var(--muted);font-weight:600}
.kpi.k-done{border-left-color:var(--done)} .kpi.k-delay{border-left-color:var(--delay)}
.kpi.k-pend{border-left-color:var(--pend)} .kpi.k-other{border-left-color:var(--other)}

.day{margin-top:16px}
.day-h{display:flex;justify-content:space-between;align-items:baseline;padding:6px 4px;font-weight:700;font-size:15px}
.day-h small{color:var(--muted);font-weight:500;font-size:12px}
.list{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.t{display:grid;grid-template-columns:70px 1fr 150px 150px 130px 92px;gap:10px;padding:11px 14px;align-items:center;border-top:1px solid var(--line)}
.t:first-child{border-top:0}
.t.th{background:var(--brand2);color:#fff;font-weight:600;font-size:12px}
.t .id{color:var(--muted);font-variant-numeric:tabular-nums}
.t .task{font-weight:500}
.t .task small{display:block;color:var(--muted);font-weight:400;font-size:12px}
.t .time{font-size:13px}
.t .time.late{color:var(--pend);font-weight:600}
.pill{display:inline-block;padding:4px 10px;border-radius:20px;font-size:12px;font-weight:600;white-space:nowrap}
.p-done{background:var(--done-bg);color:var(--done)} .p-delay{background:var(--delay-bg);color:var(--delay)}
.p-pend{background:var(--pend-bg);color:var(--pend)} .p-other{background:var(--other-bg);color:var(--other)}
.open{background:var(--brand);color:#fff;text-decoration:none;text-align:center;padding:7px 10px;border-radius:8px;font-weight:600;font-size:13px}
.open.dim{background:var(--brand-soft);color:var(--brand)}
.lbl{display:none}
.empty,.loading{text-align:center;color:var(--muted);padding:40px 16px}
.spin{width:28px;height:28px;border:3px solid var(--line);border-top-color:var(--brand);border-radius:50%;animation:s 1s linear infinite;margin:0 auto 10px}
@keyframes s{to{transform:rotate(360deg)}}

@media (max-width:760px){
  main{padding:12px}
  .t.th{display:none}
  .t{grid-template-columns:1fr auto;gap:6px 10px}
  .t .id{grid-column:1;font-size:12px}
  .t .st{grid-column:2;grid-row:1;justify-self:end}
  .t .task{grid-column:1/-1}
  .t .time{font-size:12px}
  .t .lnk{grid-column:1/-1}
  .t .open{display:block;padding:10px}
  .lbl{display:inline;color:var(--muted)}
  .field{flex:1}
  .field input,.field select{min-width:0;width:100%}
}
</style>
</head>
<body>

<!-- LOGIN -->
<section id="login">
  <form class="login-card" id="loginForm" autocomplete="on">
    <h1>My Tasks</h1>
    <p>My Dream Foods – team checklist</p>
    <label for="uid">User ID</label>
    <input id="uid" autocomplete="username" autocapitalize="none" required>
    <label for="pwd">Password</label>
    <input id="pwd" type="password" autocomplete="current-password" required>
    <button class="btn" id="loginBtn" type="submit">Login</button>
    <div class="err" id="loginErr"></div>
  </form>
</section>

<!-- APP -->
<section id="app" class="hidden">
  <header>
    <button class="menu-btn" id="menuBtn" title="Show / hide summary" type="button">☰</button>
    <button class="avatar" id="avatar" title="Change profile photo" type="button"><span id="avInit"></span><span class="cam">📷</span></button>
    <input type="file" id="photoInput" accept="image/*" class="hidden">
    <h2 id="who">Tasks</h2>
    <button class="ghost" id="refreshBtn" title="Refresh">⟳</button>
    <button class="ghost" id="logoutBtn">Logout</button>
  </header>
  <div class="layout">
  <aside id="side">
    <div class="profile" id="profile"></div>
    <div class="side-sec">Summary</div>
    <div class="side-range" id="sideRange"></div>
    <div id="sideStatus"></div>
    <div class="side-sec">Tasks per day</div>
    <div id="sideDays"></div>
  </aside>
  <div class="backdrop" id="backdrop"></div>
  <div class="content">
  <main>
    <div class="controls">
      <div class="row quick" id="quick">
        <button data-q="today" class="on">Today</button>
        <button data-q="yesterday">Yesterday</button>
        <button data-q="week">Last 7 days</button>
        <button data-q="month">This month</button>
      </div>
      <div class="row">
        <div class="field"><label>From</label><input type="date" id="from"></div>
        <div class="field"><label>To</label><input type="date" id="to"></div>
        <div class="field" id="nameWrap"><label>Name</label><select id="nameSel"></select></div>
      </div>
      <div class="row"><input id="search" placeholder="Search task or Task ID…"></div>
    </div>

    <div class="kpis" id="kpis"></div>
    <div id="out"></div>
  </main>
  </div>
  </div>
</section>

<script>
/* ===== CONFIG: paste your Apps Script Web App URL (ends with /exec) ===== */
const API_URL = 'https://script.google.com/macros/s/AKfycbyMx169m4B2Jx4cUXUNqTtyR2jAykDdY-PMvU3F9UYQFMc80YdHi4_FlieFdVqf3U8/exec';

const $ = id => document.getElementById(id);
const store = {
  get(k){ try{ return JSON.parse(localStorage.getItem(k)); }catch(e){ return null; } },
  set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} },
  del(k){ try{ localStorage.removeItem(k); }catch(e){} }
};
let S = store.get('mdfTaskSession');   // {token, role, display, names, exp}
let TASKS = [], statusFilter = 'All', NOW = Date.now();

async function api(body){
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), 90000);
  let r, txt;
  try{
    r = await fetch(API_URL, { method:'POST', redirect:'follow', signal: ctrl.signal,
      headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify(body) });
    txt = await r.text();
  }catch(e){
    if (e.name === 'AbortError') throw new Error('Server took too long (90s). Check Apps Script › Executions.');
    throw new Error('Cannot reach server. Check deployment access = "Anyone". (' + e.message + ')');
  }finally{ clearTimeout(timer); }
  try{ return JSON.parse(txt); }
  catch(e){
    if (/<html|<!DOCTYPE/i.test(txt)) throw new Error('Server returned a web page, not data. Redeploy as New version, Execute as Me, Access Anyone.');
    throw new Error('Bad server reply: ' + txt.slice(0,120));
  }
}

/* ---------- dates ---------- */
const pad = n => String(n).padStart(2,'0');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
function setRange(q){
  const t = new Date(), f = new Date();
  if (q==='yesterday'){ t.setDate(t.getDate()-1); f.setDate(f.getDate()-1); }
  if (q==='week') f.setDate(f.getDate()-6);
  if (q==='month') f.setDate(1);
  $('from').value = iso(f); $('to').value = iso(t);
  document.querySelectorAll('#quick button').forEach(b => b.classList.toggle('on', b.dataset.q===q));
}
const fmtDay = s => new Date(s+'T00:00:00').toLocaleDateString('en-IN',{weekday:'short',day:'2-digit',month:'short',year:'numeric'});
// "17/10/2026 20:06:24" -> "17 Oct, 8:06 pm" (same as Plan); date-only -> "17 Oct"
function fmtActual(s){
  s = String(s || '').trim();
  const m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})(?:\s+(\d{1,2}):(\d{2})(?::(\d{2}))?)?/);
  if (!m) return esc(s) || '—';
  const d = new Date(+m[3], +m[2]-1, +m[1], +(m[4]||0), +(m[5]||0), +(m[6]||0));
  return m[4] ? fmtTime(d.getTime())
              : d.toLocaleDateString('en-IN',{day:'2-digit',month:'short'});
}
const fmtTime = ms => ms ? new Date(ms).toLocaleString('en-IN',{day:'2-digit',month:'short',hour:'numeric',minute:'2-digit',hour12:true}) : '—';

/* ---------- status ---------- */
function cls(st){
  const s = String(st||'').trim().toLowerCase().replace(/\s+/g,' ');
  if (s.includes('delay')) return 'delay';
  if (s==='done' || s==='completed' || s==='yes') return 'done';
  if (s==='pending' || s==='not done' || s==='' ) return 'pend';
  return 'other';
}
const ORDER = ['Pending','Done but Delay','Done'];
const CATS = ['pend','done','delay','other'];
// statusFilter: 'All' | a category (pend/done/delay/other, from left panel) | exact status text (from top cards)
const matchStatus = t => statusFilter==='All'
  || (CATS.includes(statusFilter) ? cls(t.status)===statusFilter : String(t.status).trim()===statusFilter);

/* ---------- auth ---------- */
$('loginForm').addEventListener('submit', async e => {
  e.preventDefault();
  $('loginErr').textContent = ''; $('loginBtn').disabled = true; $('loginBtn').textContent = 'Checking…';
  try{
    const r = await api({ action:'login', userId:$('uid').value, password:$('pwd').value });
    if (!r.ok) throw new Error(r.error);
    S = { token:r.token, role:r.role, display:r.display, names:r.names, userId:r.userId, photo:r.photo||'', desig:r.designation||'', dept:r.department||'', company:r.company||'', exp:Date.now()+6*3600e3 };
    store.set('mdfTaskSession', S);
    startApp();
  }catch(err){ $('loginErr').textContent = err.message || 'Login failed'; }
  $('loginBtn').disabled = false; $('loginBtn').textContent = 'Login';
});

function logout(msg){
  if (S) api({ action:'logout', token:S.token }).catch(()=>{});
  S = null; store.del('mdfTaskSession');
  $('app').classList.add('hidden'); $('login').classList.remove('hidden');
  $('pwd').value = ''; $('loginErr').textContent = msg || '';
}
$('logoutBtn').onclick = () => logout();

function startApp(){
  $('login').classList.add('hidden'); $('app').classList.remove('hidden');
  $('who').innerHTML = `${esc(S.display)} <small>· ${esc(S.desig || S.role)}</small>`;
  renderProfile();
  showAvatar();
  const sel = $('nameSel');
  const opts = S.role==='Admin' ? ['', ...S.names] : (S.names.length>1 ? ['', ...S.names] : null);
  if (opts){
    sel.innerHTML = opts.map(n => `<option value="${n}">${n || 'All'}</option>`).join('');
    $('nameWrap').classList.remove('hidden');
  } else $('nameWrap').classList.add('hidden');
  setRange('today'); load();
}

/* ---------- data ---------- */
let REQ = 0;   // only the latest request may update the screen
async function load(fresh){
  const from = $('from').value, to = $('to').value;
  if (!from || !to) return;
  if (from > to){ $('kpis').innerHTML=''; $('out').innerHTML = '<div class="empty">⚠ From date is after To date.</div>'; return; }
  const my = ++REQ;
  $('out').innerHTML = '<div class="loading"><div class="spin"></div>Loading tasks…</div>'; $('kpis').innerHTML = '';
  try{
    const r = await api({ action:'tasks', token:S.token, from, to, name:$('nameSel').value || '', fresh: fresh===true });
    if (my !== REQ) return;                       // a newer request was made – ignore this reply
    if (!r.ok){
      if (r.error==='SESSION_EXPIRED') return logout('Session expired, please login again.');
      throw new Error(r.error);
    }
    TASKS = r.tasks.filter(t => t.date >= from && t.date <= to).map(t => { const c = cls(t.status); return {...t, status: ({pend:'Pending', done:'Done', delay:'Done but Delay'})[c] || String(t.status).trim()}; });   // safety: keep only chosen range
    NOW = r.serverNow || Date.now();
    render();
  }catch(err){
    if (my !== REQ) return;
    $('out').innerHTML = `<div class="empty">⚠ ${err.message || 'Could not load tasks'}</div>`;
  }
}

function render(){
  const q = $('search').value.trim().toLowerCase();
  const base = TASKS.filter(t => !q || String(t.task).toLowerCase().includes(q) || String(t.id).includes(q));

  // KPI / status chips
  const counts = {};
  base.forEach(t => { const k = String(t.status).trim(); counts[k] = (counts[k]||0)+1; });
  const keys = [...new Set([...ORDER.filter(k=>counts[k]), ...Object.keys(counts)])];
  if (statusFilter!=='All' && !CATS.includes(statusFilter) && !counts[statusFilter]) statusFilter = 'All';
  $('kpis').innerHTML = [`<div class="kpi ${statusFilter==='All'?'on':''}" data-s="All"><b>${base.length}</b><span>All tasks</span></div>`]
    .concat(keys.map(k => `<div class="kpi k-${cls(k)} ${statusFilter===k?'on':''}" data-s="${k}"><b>${counts[k]}</b><span>${k}</span></div>`)).join('');
  document.querySelectorAll('.kpi').forEach(el => el.onclick = () => { statusFilter = el.dataset.s; render(); });

  renderSide(base);
  const list = base.filter(matchStatus);
  if (!list.length){ $('out').innerHTML = '<div class="empty">No tasks for this selection.</div>'; return; }

  // group datewise (latest first), pending first inside a day, then by plan time
  const byDay = {};
  list.forEach(t => (byDay[t.date] = byDay[t.date] || []).push(t));
  const showName = S.role==='Admin' || S.names.length>1;
  $('out').innerHTML = Object.keys(byDay).sort().reverse().map(d => {
    const rows = byDay[d].sort((a,b) => (cls(a.status)==='pend'?0:1)-(cls(b.status)==='pend'?0:1) || (a.planMs||0)-(b.planMs||0));
    const pend = rows.filter(t => cls(t.status)==='pend').length;
    return `<div class="day" id="day-${d}">
      <div class="day-h">${fmtDay(d)} <small>${rows.length} tasks · ${pend} pending</small></div>
      <div class="list">
        <div class="t th"><div>Task ID</div><div>Task</div><div>Plan</div><div>Actual</div><div>Status</div><div>Form</div></div>
        ${rows.map(t => {
          const c = cls(t.status), late = c==='pend' && t.planMs && t.planMs < NOW;
          return `<div class="t">
            <div class="id">#${t.id}</div>
            <div class="task">${esc(t.task)}${showName?`<small>${esc(t.name)} · ${esc(t.dept||'')}</small>`:''}</div>
            <div class="time ${late?'late':''}"><span class="lbl">Plan: </span>${fmtTime(t.planMs)}${late?' ⏰':''}</div>
            <div class="time"><span class="lbl">Actual: </span>${fmtActual(t.actual)}</div>
            <div class="st"><span class="pill p-${c}">${esc(t.status)}</span></div>
            <div class="lnk">${t.link ? `<a class="open ${c==='pend'?'':'dim'}" href="${esc(t.link)}" target="_blank" rel="noopener">${c==='pend'?'Fill Form':'Open'}</a>` : ''}</div>
          </div>`;
        }).join('')}
      </div></div>`;
  }).join('');
}
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ---------- events ---------- */
document.querySelectorAll('#quick button').forEach(b => b.onclick = () => { setRange(b.dataset.q); load(); });
let dateTimer;
['from','to'].forEach(id => $(id).onchange = () => {
  document.querySelectorAll('#quick button').forEach(b=>b.classList.remove('on'));
  clearTimeout(dateTimer); dateTimer = setTimeout(load, 700);   // wait till both dates are picked
});
$('nameSel').onchange = () => load();
$('refreshBtn').onclick = () => load(true);
$('search').oninput = render;

/* ---------- profile card ---------- */
function renderProfile(){
  const ph = S.photo ? `style="background-image:url('${S.photo}')"` : '';
  const ini = S.photo ? '' : esc((S.display||'?').trim().charAt(0).toUpperCase());
  $('profile').innerHTML = `<div class="pic" id="profPic" title="Change profile photo" ${ph}>${ini}<span class="cam">📷</span></div>
    <div>
    ${S.desig ? `<div class="dg">${esc(S.desig)}</div>` : ''}
    ${S.dept ? `<div class="dp">${esc(S.dept)}</div>` : ''}
    ${S.company ? `<div class="dp">🏢 ${esc(S.company)}</div>` : ''}</div>`;
  $('profPic').onclick = () => $('photoInput').click();
}

/* ---------- sidebar ---------- */
function renderSide(base){
  const f = $('from').value, t = $('to').value;
  $('sideRange').textContent = f===t ? fmtDay(f) : `${fmtDay(f)} → ${fmtDay(t)}`;
  const n = { all: base.length, pend:0, done:0, delay:0, other:0 };
  base.forEach(x => n[cls(x.status)]++);
  const items = [
    ['All',   'Total Tasks', n.all,   'c-all'],
    ['pend',  'Pending',     n.pend,  'c-pend'],
    ['done',  'Done',        n.done,  'c-done'],
    ['delay', 'Delayed',     n.delay, 'c-delay']
  ];
  if (n.other) items.push(['other', 'Holiday / Absent / Other', n.other, 'c-other']);
  const isOn = k => statusFilter===k;
  $('sideStatus').innerHTML = items.map(([k,l,v,c]) =>
    `<button class="s-item ${isOn(k)?'on':''}" data-k="${k}"><span class="dot ${c}"></span><span class="lbl2">${l}</span><b>${v}</b></button>`).join('');
  $('sideStatus').querySelectorAll('.s-item').forEach(b => b.onclick = () => {
    const k = b.dataset.k;
    statusFilter = (statusFilter===k && k!=='All') ? 'All' : k;
    render(); closeSideOnMobile();
  });

  const byDay = {};
  base.forEach(x => { const d = byDay[x.date] = byDay[x.date] || {all:0,pend:0,done:0,delay:0,other:0}; d.all++; d[cls(x.status)]++; });
  const days = Object.keys(byDay).sort().reverse();
  $('sideDays').innerHTML = days.length ? days.map(d => {
    const v = byDay[d], w = k => (v[k] / v.all * 100).toFixed(1) + '%';
    return `<button class="s-day" data-d="${d}">
      <div class="top">${new Date(d+'T00:00:00').toLocaleDateString('en-IN',{weekday:'short',day:'2-digit',month:'short'})}<span>${v.all} tasks</span></div>
      <div class="bar"><i class="c-done" style="width:${w('done')}"></i><i class="c-delay" style="width:${w('delay')}"></i><i class="c-pend" style="width:${w('pend')}"></i><i class="c-other" style="width:${w('other')}"></i></div>
      <div class="mini"><span>✔ ${v.done}</span><span>⏱ ${v.delay}</span><span>● ${v.pend} pending</span></div>
    </button>`;
  }).join('') : '<div class="side-empty">No tasks</div>';
  $('sideDays').querySelectorAll('.s-day').forEach(b => b.onclick = () => {
    if (statusFilter!=='All' && !document.getElementById('day-'+b.dataset.d)){ statusFilter='All'; render(); }
    const el = document.getElementById('day-'+b.dataset.d);
    if (el) window.scrollTo({ top: el.getBoundingClientRect().top + window.scrollY - 76, behavior:'smooth' });
    closeSideOnMobile();
  });
}
const isMobile = () => window.matchMedia('(max-width:900px)').matches;
function setSide(open){
  $('app').classList.toggle('side-closed', !open);
  if (!isMobile()) store.set('mdfSideOpen', open);
}
function closeSideOnMobile(){ if (isMobile()) setSide(false); }
$('menuBtn').onclick = () => setSide($('app').classList.contains('side-closed'));
$('backdrop').onclick = () => setSide(false);
setSide(isMobile() ? false : store.get('mdfSideOpen') !== false);

/* ---------- profile photo ---------- */
function showAvatar(){
  const a = $('avatar');
  if (S.photo){ a.style.backgroundImage = `url("${S.photo}")`; $('avInit').textContent = ''; }
  else { a.style.backgroundImage = ''; $('avInit').textContent = (S.display||'?').trim().charAt(0).toUpperCase(); }
}
function toast(msg){
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), 3500);
}
// Resize to max 400px square-ish JPEG in the browser (keeps upload small & fast)
function resizeImage(file, max = 400){
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const sc = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * sc); c.height = Math.round(img.height * sc);
      const ctx = c.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0,0,c.width,c.height);
      ctx.drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg', 0.85));
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('Could not read this image')); };
    img.src = url;
  });
}
$('avatar').onclick = () => $('photoInput').click();
$('photoInput').onchange = async e => {
  const f = e.target.files[0]; e.target.value = '';
  if (!f) return;
  if (!f.type.startsWith('image/')) return toast('Please choose a photo');
  const a = $('avatar'); a.classList.add('busy'); toast('Uploading photo…');
  try{
    const data = await resizeImage(f);
    const r = await api({ action:'uploadPhoto', token:S.token, data, mime:'image/jpeg' });
    if (!r.ok){ if (r.error==='SESSION_EXPIRED') return logout('Session expired, please login again.'); throw new Error(r.error); }
    S.photo = r.photo; store.set('mdfTaskSession', S); showAvatar(); renderProfile(); toast('Profile photo updated ✓');
  }catch(err){ toast('⚠ ' + (err.message || 'Upload failed')); }
  a.classList.remove('busy');
};

/* ---------- boot ---------- */
if (S && S.token && S.exp > Date.now()) startApp(); else logout();
</script>
